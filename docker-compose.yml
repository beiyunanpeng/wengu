# wengu 本地一键起（家长部署主路径）
# 无外部依赖：SQLite + 本地卷即全部；无 MySQL / Redis / 外部 MQ
services:
  api:
    build: ./wengu-api
    image: wengu/api:latest
    container_name: wengu-api
    env_file:
      - path: ./wengu-api/.env
        required: false                  # P1-0 不需要密钥；家长填 .env 后自动生效
    environment:
      WENGU_ENV: ${WENGU_ENV:-prod}
      WENGU_DATA_DIR: /app/data
      WENGU_UPLOADS_DIR: /app/data/uploads
      WENGU_DB_PATH: /app/data/wengu.db
      WENGU_PROMPTS_DIR: /app/llm_prompts
      WENGU_SEEDS_DIR: /app/seeds
      WENGU_APP_CONFIG_PATH: /app/config/app-config.json
    volumes:
      - ./data:/app/data                # SQLite + uploads
      - ./config:/app/config            # app-config.json 热配置（UI 可写）
      - ./seeds:/app/seeds:ro           # seed 包（data/ 随仓库分发；local/ 与 mappings/ 家长自建）
      - ./llm_prompts:/app/llm_prompts:ro  # 提示词真源只读挂载
    ports:
      - "${WENGU_API_PORT:-8000}:8000"  # 8000 被系统保留时：WENGU_API_PORT=8100 docker compose up
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./wengu-web
    image: wengu/web:latest
    container_name: wengu-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WENGU_WEB_PORT:-5173}:80"    # nginx 静态托管，映射到 5173 免与本地 vite 冲突
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：远程访问用 Tailscale（AGENTS §3 推荐）。取消注释即启用。
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   container_name: wengu-tailscale
  #   hostname: wengu-at-home
  #   environment:
  #     - TS_AUTHKEY=${TS_AUTHKEY}
  #     - TS_STATE_DIR=/var/lib/tailscale
  #     - TS_SERVE_CONFIG=/config/serve.json
  #   volumes:
  #     - ./tailscale-state:/var/lib/tailscale
  #     - ./deploy/tailscale/serve.json:/config/serve.json:ro
  #   devices:
  #     - /dev/net/tun
  #   cap_add:
  #     - NET_ADMIN
  #   network_mode: service:api
  #   restart: unless-stopped

# 注：
# 1) 公网暴露前必须自行加反向代理鉴权（Tailscale / Caddy basic auth / Nginx + OAuth）；
#    wengu 默认按"本机 / 可信内网"设计，见 AGENTS.md §2.4。
# 2) 数据全部在 ./data 目录下，备份/迁移 = 拷这一坨（含 wengu.db + uploads/）。
# 3) 运行时热配置在 ./config/app-config.json；密钥仍在 wengu-api/.env。
