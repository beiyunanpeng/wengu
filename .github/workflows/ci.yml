name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wengu-api/requirements.txt
      - name: Install dependencies
        run: pip install -r wengu-api/requirements.txt
      - name: Lint
        working-directory: wengu-api
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Validate compose file
        run: docker compose config -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wengu-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wengu-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit test
        run: npm test
      - name: Build
        run: npm run build

  transcribe:
    # 转录可选包：纯标准库，绝不安装任何额外依赖（不 pip install），独立于 api/web。
    # 后端行为锚定测试（test_transcribe_contract_anchor.py）由 api job 的 pytest 覆盖。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selfcheck (strict)
        run: python transcribe/validate.py selfcheck --strict
      - name: Evals
        run: python transcribe/validate.py evals
      - name: py_compile
        run: python -m py_compile transcribe/validate.py
